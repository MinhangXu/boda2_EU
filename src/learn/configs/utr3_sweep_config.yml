program: train_wandb_log.py 
method: bayes
metric:
  name: epoch_end_val_r2
  goal: maximize
parameters:
  # Main arguments
  data_module:
    value: UTR3_RNA_Activity_DataModule
  model_module:
    value: UTR_BassetVL
  graph_module:
    value: CNNBasicTraining
  checkpoint_monitor:
    value: epoch_end_val_r2
  stopping_mode:
    value: max
  stopping_patience:
    value: 30
  logger_type:
    value: wandb
  logger_project:
    value: utr3_rna_activity_optimization
  run_name:
    value: "utr3_model_{runid}" 
  artifact_path:
    value: /home/minhang/synBio_AL/boda2_EU/src/local_artifacts/utr3/sweep/
  
  # Data module parameters
  datafile_path:
    value: /home/minhang/synBio_AL/opt_EU_learn_n_design/utr_hani_2025/processed_utr_data/3UTR_lib1_processed.csv
  target_cell_type:
    value: c2
  sequence_column:
    value: seq
  activity_column:
    value: rna_activity
  fold_column:
    value: fold
  split_by_fold:
    value: True
  normalize_activity:
    value: True
  use_reverse_complements:
    value: False
  duplication_cutoff:
    value: "None"
  batch_size:
    distribution: categorical
    values: [128, 256, 512]
  num_workers:  
    value: 8   # Controls CPU parallelism for data loading for one single training run
  seed:
    value: 42
  
  # Model module parameters - Based on UTR_BassetVL architecture
  input_len:
    value: 240  # Fixed based on your 3'UTR sequences
  adaptive_pool_output_size: # New hyperparameter
    distribution: categorical
    values: [0, 5, 10]   # 0 for no pooling, 5 or 10 for pooled output sizes

  # Conv layer hyperparameters - scaled up for longer sequences
  conv1_channels:
    distribution: int_uniform
    min: 200
    max: 400
  conv1_kernel_size:
    distribution: categorical
    values: [7, 11, 15, 19]  # Similar to original Basset
    
  conv2_channels:
    distribution: int_uniform
    min: 150
    max: 300
  conv2_kernel_size:
    distribution: categorical
    values: [7, 11, 15]
    
  conv3_channels:
    distribution: int_uniform
    min: 150
    max: 300
  conv3_kernel_size:
    distribution: categorical
    values: [5, 7, 11]
  
  # Linear layer hyperparameters
  n_linear_layers:
    distribution: categorical
    values: [1, 2, 3]
  linear_channels:
    distribution: int_uniform
    min: 500
    max: 1500
  linear_activation:
    distribution: categorical
    values: [ReLU, LeakyReLU, ELU]
  linear_dropout_p:
    distribution: uniform
    min: 0.1
    max: 0.5
  
  # Output and loss
  n_outputs:
    value: 1
  use_batch_norm:
    distribution: categorical
    values: [True, False]
  use_weight_norm:
    value: False
  loss_criterion:
    value: MSELoss
  
  # Graph module parameters (optimizer settings)
  optimizer:
    distribution: categorical
    values: [Adam, AdamW]
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  weight_decay:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  amsgrad:
    distribution: categorical
    values: [True, False]
  beta1:
    distribution: uniform
    min: 0.85
    max: 0.95
  beta2:
    distribution: uniform
    min: 0.99
    max: 0.999
    
  # Scheduler parameters - using CosineAnnealingWarmRestarts like utr5 config
  scheduler:
    distribution: categorical
    values: [CosineAnnealingWarmRestarts, "None"]
  T_0:
    distribution: categorical  
    values: [500, 1000, 2000]
  T_mult:
    value: 1
  eta_min:
    value: 0.0
  scheduler_interval:
    value: step
    
  # Lightning Trainer parameters
  accelerator:
    value: gpu
  devices:
    value: 1
  min_epochs:
    value: 20
  max_epochs:
    value: 200
  precision:
    value: 16
  default_root_dir:
    value: /tmp/output/artifacts