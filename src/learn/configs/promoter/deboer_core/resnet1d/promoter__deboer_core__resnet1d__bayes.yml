program: train_wandb_log.py
entity: minhangxu1998-baylor-college-of-medicine
project: promoter__deboer_core__scratch__resnet1d
method: bayes
metric:
  name: epoch_end_val_pearson_r2
  goal: maximize
parameters:
  # Main arguments
  data_module:
    value: PromoterDataModule
  model_module:
    value: ResNet1DRegressor
  graph_module:
    value: CNNBasicTraining
  checkpoint_monitor:
    value: epoch_end_val_pearson_r2
  stopping_mode:
    value: max
  stopping_patience:
    value: 50
  logger_type:
    value: wandb
  logger_project:
    value: promoter__deboer_core__scratch__resnet1d
  run_name: { value: "promoter_resnet1d_{runid}" }
  artifact_path:
    value: /home/minhang/synBio_AL/boda2_EU/src/learn/local_artifacts/promoter/deboer_core/resnet1d/bayes

  # Data module parameters
  datafile_path:
    value: /home/minhang/synBio_AL/Core_Promoter_Model/deBoer_model/preprocess_data/core_promoter_data_with_rc_df_comb_apr1.csv
  batch_size:
    value: 512
  seed:
    value: 42
  num_workers:
    value: 8
  padded_seq_len:
    value: 84
  use_reverse_complements:
    distribution: categorical
    values: [True, False]

  # Model module parameters
  input_len:
    value: 84
  stem_channels:
    distribution: int_uniform
    min: 48
    max: 128
  stem_kernel_size:
    distribution: categorical
    values: [7, 11, 15]
  block_kernel_size:
    distribution: categorical
    values: [5, 7, 9]
  dropout_p:
    distribution: uniform
    min: 0.1
    max: 0.4
  head_hidden_channels:
    distribution: int_uniform
    min: 64
    max: 256
  n_outputs:
    value: 1
  use_batch_norm:
    value: True
  loss_criterion:
    value: "MSELoss"
  reduction:
    value: mean

  # Graph module parameters
  optimizer:
    distribution: categorical
    values: [Adam, AdamW]
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  weight_decay:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.001
  amsgrad:
    value: True
  beta1:
    distribution: uniform
    min: 0.8
    max: 0.95
  beta2:
    distribution: uniform
    min: 0.99
    max: 0.999

  # Scheduler parameters
  scheduler:
    distribution: categorical
    values: [CosineAnnealingWarmRestarts, "None"]
  T_0:
    distribution: categorical
    values: [1000, 2000, 4096]
  T_mult:
    value: 1
  eta_min:
    value: 0.0
  scheduler_interval:
    value: step

  # Lightning Trainer parameters
  accelerator:
    value: gpu
  devices:
    value: 1
  min_epochs:
    value: 50
  max_epochs:
    value: 300
  precision:
    value: 16
  default_root_dir:
    value: /home/minhang/synBio_AL/boda2_EU/src/learn/outputs/promoter/deboer_core/resnet1d/bayes
