program: train_wandb_log.py
entity: minhangxu1998-baylor-college-of-medicine
project: utr5__hani_rna_activity__scratch__utr_bassetvl
method: bayes
metric:
  name: epoch_end_val_pearson_r2
  goal: maximize
parameters:
  # --- Data and Logging ---
  data_module:
    value: UTR5_RNA_Activity_DataModule
  datafile_path:
    value: /home/minhang/synBio_AL/opt_EU_learn_n_design/utr_hani_2025/processed_utr_data/5UTR_lib1_processed.csv
  artifact_path:
    value: /home/minhang/synBio_AL/boda2_EU/src/learn/local_artifacts/utr5/hani_rna_activity/utr_bassetvl/bayes
  default_root_dir:
    value: /home/minhang/synBio_AL/boda2_EU/src/learn/outputs/utr5/hani_rna_activity/utr_bassetvl/bayes
  logger_project:
    value: utr5__hani_rna_activity__scratch__utr_bassetvl
  logger_type:
    value: wandb
  run_name:
    value: utr5_hani_model_{runid}
  sequence_column:
    value: seq
  activity_column:
    value: rna_activity
  fold_column:
    value: fold
  split_by_fold:
    value: True
  target_cell_type:
    value: c2
  normalize_activity:
    value: True

  # --- Trainer Settings ---
  accelerator:
    value: gpu
  devices:
    value: 1
  precision:
    value: 16
  max_epochs:
    value: 300
  min_epochs:
    value: 30
  stopping_patience:
    value: 40
  stopping_mode:
    value: max
  checkpoint_monitor:
    value: epoch_end_val_pearson_r2

  # --- Model Architecture ---
  graph_module:
    value: CNNBasicTraining
  model_module:
    value: UTR_BassetVL
  input_len:
    value: 50
  n_outputs:
    value: 1
  conv1_channels:
    distribution: int_uniform
    min: 100
    max: 160
  conv1_kernel_size:
    distribution: categorical
    values: [6, 8, 10]
  conv2_channels:
    distribution: int_uniform
    min: 100
    max: 160
  conv2_kernel_size:
    distribution: categorical
    values: [6, 8, 10]
  conv3_channels:
    distribution: int_uniform
    min: 100
    max: 160
  conv3_kernel_size:
    distribution: categorical
    values: [6, 8, 10]
  n_linear_layers:
    distribution: categorical
    values: [1, 2]
  linear_channels:
    distribution: int_uniform
    min: 30
    max: 80
  linear_activation:
    distribution: categorical
    values: [LeakyReLU, ReLU]
  linear_dropout_p:
    distribution: uniform
    min: 0.1
    max: 0.4
  use_batch_norm:
    value: True
  use_weight_norm:
    value: False
  use_reverse_complements:
    distribution: categorical
    values: [true, false]

  # --- Optimizer and Scheduler ---
  optimizer:
    distribution: categorical
    values: [AdamW, Adam]
  loss_criterion:
    value: MSELoss
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  beta1:
    distribution: uniform
    min: 0.85
    max: 0.95
  beta2:
    distribution: uniform
    min: 0.98
    max: 0.999
  amsgrad:
    value: True
  weight_decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  scheduler:
    value: CosineAnnealingWarmRestarts
  scheduler_interval:
    value: step
  T_0:
    value: 2000
  T_mult:
    value: 1
  eta_min:
    value: 0

  # --- Execution ---
  batch_size:
    value: 256
  num_workers:
    value: 8
  seed:
    value: 42
