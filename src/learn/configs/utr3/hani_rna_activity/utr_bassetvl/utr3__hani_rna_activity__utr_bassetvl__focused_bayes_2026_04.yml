program: train_wandb_log.py
entity: minhangxu1998-baylor-college-of-medicine
project: utr3__hani_rna_activity__focused__utr_bassetvl
method: bayes
metric:
  name: epoch_end_val_pearson_r2
  goal: maximize
parameters:
  # Main arguments
  data_module:
    value: UTR3_RNA_Activity_DataModule
  model_module:
    value: UTR_BassetVL
  graph_module:
    value: CNNBasicTraining
  checkpoint_monitor:
    value: epoch_end_val_pearson_r2
  stopping_mode:
    value: max
  stopping_patience:
    value: 30
  logger_type:
    value: wandb
  logger_project:
    value: utr3__hani_rna_activity__focused__utr_bassetvl
  run_name:
    value: "utr3_focused_202604_{runid}"
  artifact_path:
    value: /home/minhang/synBio_AL/boda2_EU/src/learn/local_artifacts/utr3/hani_rna_activity/utr_bassetvl/focused_bayes_2026_04
  best_checkpoint_dir:
    value: /home/minhang/synBio_AL/boda2_EU/src/learn/utr3__hani_rna_activity__focused__utr_bassetvl/best_checkpoint_model

  # Data module parameters
  datafile_path:
    value: /home/minhang/synBio_AL/opt_EU_learn_n_design/utr_hani_2025/processed_utr_data/3UTR_lib1_processed.csv
  target_cell_type:
    value: c2
  sequence_column:
    value: seq
  activity_column:
    value: rna_activity
  fold_column:
    value: fold
  split_by_fold:
    value: True
  normalize_activity:
    value: True
  use_reverse_complements:
    value: False
  duplication_cutoff:
    value: "None"
  batch_size:
    value: 512
  num_workers:
    value: 8
  seed:
    value: 42

  # Light focused search; current top UTR3 runs are close together.
  input_len:
    value: 240
  adaptive_pool_output_size:
    distribution: categorical
    values: [5, 10]
  conv1_channels:
    distribution: int_uniform
    min: 200
    max: 280
  conv1_kernel_size:
    distribution: categorical
    values: [7, 11, 15]
  conv2_channels:
    distribution: int_uniform
    min: 180
    max: 280
  conv2_kernel_size:
    distribution: categorical
    values: [11, 15]
  conv3_channels:
    distribution: int_uniform
    min: 150
    max: 220
  conv3_kernel_size:
    value: 11
  n_linear_layers:
    distribution: categorical
    values: [2, 3]
  linear_channels:
    distribution: int_uniform
    min: 550
    max: 1500
  linear_activation:
    distribution: categorical
    values: [LeakyReLU, ELU]
  linear_dropout_p:
    distribution: uniform
    min: 0.12
    max: 0.40
  n_outputs:
    value: 1
  use_batch_norm:
    distribution: categorical
    values: [True, False]
  use_weight_norm:
    value: False
  loss_criterion:
    value: MSELoss

  # Graph module parameters
  optimizer:
    distribution: categorical
    values: [Adam, AdamW]
  lr:
    distribution: log_uniform_values
    min: 0.0003
    max: 0.003
  weight_decay:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  amsgrad:
    distribution: categorical
    values: [True, False]
  beta1:
    distribution: uniform
    min: 0.89
    max: 0.94
  beta2:
    distribution: uniform
    min: 0.991
    max: 0.998
  scheduler:
    distribution: categorical
    values: ["None", CosineAnnealingWarmRestarts]
  T_0:
    distribution: categorical
    values: [500, 1000]
  T_mult:
    value: 1
  eta_min:
    value: 0.0
  scheduler_interval:
    value: step

  # Lightning Trainer parameters
  accelerator:
    value: gpu
  devices:
    value: 1
  min_epochs:
    value: 20
  max_epochs:
    value: 200
  precision:
    value: 16
  default_root_dir:
    value: /home/minhang/synBio_AL/boda2_EU/src/learn/outputs/utr3/hani_rna_activity/utr_bassetvl/focused_bayes_2026_04
