# src/learn/configs/utr3/hani_rna_activity/utr_bassetvl/utr3__hani_rna_activity__utr_bassetvl__focused_bayes__2025-06-16.yml
program: train_wandb_log.py
method: bayes
metric:
  name: epoch_end_val_r2
  goal: maximize
parameters:
  # --- Data and Logging ---
  data_module:
    value: HaniGoozardi_RNA_Activity_DataModule
  datafile_path:
    value: /home/minhang/synBio_AL/opt_EU_learn_n_design/utr_hani_2025/processed_utr_data/3UTR_lib1_processed.csv
  artifact_path:
    value: /home/minhang/synBio_AL/boda2_EU/src/learn/local_artifacts/utr3/hani_rna_activity/utr_bassetvl/focused_bayes_2025_06_16
  model_module: { value: UTR_BassetVL }
  graph_module: { value: CNNBasicTraining }
  checkpoint_monitor: { value: epoch_end_val_r2 }
  stopping_mode: { value: max }
  stopping_patience: { value: 30 }
  logger_type: { value: wandb }
  logger_project: { value: utr3__hani_rna_activity__utr_bassetvl }
  run_name: { value: "utr3_focused_jun16_{runid}" }

  # --- Data module parameters ---
  use_reverse_complements: { distribution: categorical, values: [True, False] }
  batch_size: { distribution: categorical, values: [256, 512] }
  target_cell_type: { value: c2 }
  split_by_fold: { value: True }
  normalize_activity: { value: True }
  num_workers: { value: 8 }
  seed: { value: 42 }

  # --- Model module parameters (Focused Search) ---
  input_len: { value: 240 }

  conv1_channels: { distribution: int_uniform, min: 250, max: 350 }
  conv1_kernel_size: { distribution: categorical, values: [5, 7, 11] }

  conv2_channels: { distribution: int_uniform, min: 200, max: 300 }
  conv2_kernel_size: { distribution: categorical, values: [7, 11, 15] }

  conv3_channels: { distribution: int_uniform, min: 200, max: 300 }
  conv3_kernel_size: { distribution: categorical, values: [7, 11, 15] }

  n_linear_layers: { distribution: categorical, values: [1, 2] }
  linear_channels: { distribution: int_uniform, min: 512, max: 800 }
  linear_activation: { value: LeakyReLU }
  linear_dropout_p: { distribution: uniform, min: 0.25, max: 0.5 }

  # --- Graph module parameters (Focused Search) ---
  optimizer: { value: AdamW }
  lr:
    # Tighter search around the best LR of ~0.00116
    distribution: log_uniform_values
    min: 0.0005
    max: 0.002
  weight_decay:
    # Tighter search around the best value of ~0.00597
    distribution: log_uniform_values
    min: 0.001
    max: 0.01

  scheduler: { value: CosineAnnealingWarmRestarts }
  T_0: { distribution: categorical, values: [1000, 2000] }

  # --- Lightning Trainer parameters ---
  accelerator: { value: gpu }
  devices: { value: 1 }
  max_epochs: { value: 200 }
  precision: { value: 16 }
  default_root_dir: { value: /home/minhang/synBio_AL/boda2_EU/src/learn/outputs/utr3/hani_rna_activity/utr_bassetvl/focused_bayes_2025_06_16 }
