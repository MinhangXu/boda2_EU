program: train_wandb_log.py
entity: minhangxu1998-baylor-college-of-medicine
project: utr3__hani_rna_activity__focused__basset_branched
method: bayes
metric:
  name: epoch_end_val_pearson_r2
  goal: maximize
parameters:
  # Data and logging
  data_module:
    value: UTR3_Branched_RNA_Activity_DataModule
  datafile_path:
    value: /home/minhang/synBio_AL/opt_EU_learn_n_design/utr_hani_2025/processed_utr_data/3UTR_lib1_branched_observed_heads.csv
  artifact_path:
    value: /home/minhang/synBio_AL/boda2_EU/src/learn/local_artifacts/utr3/hani_rna_activity/basset_branched/focused_bayes
  default_root_dir:
    value: /home/minhang/synBio_AL/boda2_EU/src/learn/outputs/utr3/hani_rna_activity/basset_branched/focused_bayes
  logger_project:
    value: utr3__hani_rna_activity__focused__basset_branched
  logger_type:
    value: wandb
  run_name:
    value: utr3_hani_basset_branched_focused_{runid}
  sequence_column:
    value: seq
  activity_columns:
    value: [c1, c2, c4, c6, c13, c17]
  output_names:
    value: [c1, c2, c4, c6, c13, c17]
  fold_column:
    value: fold
  split_by_fold:
    value: True
  normalize_activity:
    value: True

  # Trainer settings
  accelerator:
    value: gpu
  devices:
    value: 1
  precision:
    value: 16
  max_epochs:
    value: 260
  min_epochs:
    value: 30
  stopping_patience:
    value: 40
  stopping_mode:
    value: max
  checkpoint_monitor:
    value: epoch_end_val_pearson_r2

  # Model architecture
  graph_module:
    value: CNNBasicTraining
  model_module:
    value: BassetBranched
  input_len:
    value: 240
  n_outputs:
    value: 6
  conv1_channels:
    distribution: int_uniform
    min: 140
    max: 300
  conv1_kernel_size:
    distribution: categorical
    values: [7, 11, 15]
  conv2_channels:
    distribution: int_uniform
    min: 100
    max: 240
  conv2_kernel_size:
    distribution: categorical
    values: [5, 7, 11]
  conv3_channels:
    distribution: int_uniform
    min: 100
    max: 220
  conv3_kernel_size:
    distribution: categorical
    values: [5, 7, 11]
  n_linear_layers:
    distribution: categorical
    values: [1, 2]
  linear_channels:
    distribution: int_uniform
    min: 320
    max: 800
  linear_activation:
    distribution: categorical
    values: [ReLU, LeakyReLU, ELU]
  linear_dropout_p:
    distribution: uniform
    min: 0.10
    max: 0.42
  n_branched_layers:
    distribution: categorical
    values: [2, 3]
  branched_channels:
    distribution: int_uniform
    min: 64
    max: 256
  branched_activation:
    distribution: categorical
    values: [ReLU, LeakyReLU, ELU]
  branched_dropout_p:
    distribution: uniform
    min: 0.10
    max: 0.40
  use_batch_norm:
    distribution: categorical
    values: [True, False]
  use_weight_norm:
    value: False

  # Optimizer and scheduler
  optimizer:
    distribution: categorical
    values: [Adam, AdamW]
  loss_criterion:
    value: MSELoss
  reduction:
    value: mean
  lr:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.0035
  beta1:
    distribution: uniform
    min: 0.86
    max: 0.95
  beta2:
    distribution: uniform
    min: 0.985
    max: 0.999
  amsgrad:
    distribution: categorical
    values: [True, False]
  weight_decay:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.005
  scheduler:
    distribution: categorical
    values: [CosineAnnealingWarmRestarts, "None"]
  scheduler_interval:
    value: step
  T_0:
    distribution: categorical
    values: [1000, 2000, 4000]
  T_mult:
    value: 1
  eta_min:
    value: 0.0

  # Execution
  batch_size:
    distribution: categorical
    values: [256, 512]
  num_workers:
    value: 8
  use_reverse_complements:
    value: False
  seed:
    value: 42
